      function listo() {
  
          const $botonn = document.querySelector("#btnCapturar");
          const $objetivo2 = document.querySelector("#contenedor2");
  
          const enviarCapturaAServidor2 = canvas => {
              let imagenComoBase64 = canvas.toDataURL();
              imagenComoBase64 = encodeURIComponent(imagenComoBase64);
              const payload = {
                  "captura": imagenComoBase64,
                  "by": "Parzibyte",
              };
              const ruta = "https://unircredencial.com.ar/p1/capture.php";
              fetch(ruta, {
                  method: "POST",
                  body: JSON.stringify(payload),
                  headers: {
                      "Content-type": "application/x-www-form-urlencoded",
                  }
              })
                  .then(resultado => {
                      return resultado.text()
                  })
                  .then(nombreDeLaFoto => {
                      console.log({ nombreDeLaFoto });
                      cot2(nombreDeLaFoto);
                  });
          };
  
          html2canvas($objetivo2)
              .then(enviarCapturaAServidor2);
  
      }
  
  
      function cot2(a) {
          var url_string = window.location.href;
          var url = new URL(url_string);
          var c = url.searchParams.get("nombre");
          var c2 = url.searchParams.get("correo");
  
          if (c2 !== null) {

              comprueba_correo2(c3d, c4d, a);

   c3d = atob(nombreCifrado);

}

      function comprueba_correo2(name,email, cd) {
       
          $.ajax({
              url: 'https://unircredencial.com.ar/p1/correoA.php',
              type: 'POST',
              cache: false,
              data: 'correo=' + email + '&nombre=' + name + '&foto=' + cd,
              beforeSend: function () {
                // mostrarCarga();
              // mostraMensajeInfo();
                
              },
              success: function (resultado) {
                  var nombre = resultado.nombre;
                  var estados = resultado.estado;
                  if (estados == 'true') {
                  //  mostraMensajeSuccess();
                    ocultarCarga();
                      // Correcto
                  } else {
                      alert("Algo salio mal, intente nuevamente: " + nombre);
                     // window.location.replace("https://unircredencial.com/");
                  }
              },
              error: function (jqXHR, textStatus, errorThrown) {
                ocultarCarga();
                  if (jqXHR.status === 0) {
                      alert('Not connect: Verify Network.');
                  } else if (jqXHR.status == 404) {
                      alert('Requested page not found [404]');
                  } else if (jqXHR.status == 500) {
                      alert('Internal Server Error [500].');
                  } else if (textStatus === 'parsererror') {
                      alert('Requested JSON parse failed.');
                  } else if (textStatus === 'timeout') {
                      alert('Time out error.');
                  } else if (textStatus === 'abort') {
                      alert('Ajax request aborted.');
                  } else {
                      alert('Uncaught Error: ' + jqXHR.responseText);
                  }
              }
          });
      }

      
function mostrarCarga() {
